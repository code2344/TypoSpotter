<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TypoSpotter preview</title>
    <style>
      body { margin: 0; color: #202122; background: #fff; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .preview-page { max-width: 1540px; margin: 0 auto; padding: 1.5rem 2rem; }
      .preview-page > h1 { margin: 0 0 .3rem; font: 2rem/1.2 Georgia, serif; border-bottom: 1px solid #a2a9b1; }
      .preview-page > p { color: #54595d; margin: 0 0 1.25rem; }
      .diff-deletedline { background: #ffe49c; }
      .diff-addedline { background: #a3d3ff; }
      .diff-marker { width: 2%; text-align: center; }
      .diff-context, .diff-deletedline, .diff-addedline { padding: .4rem; font-family: monospace; }
      del { background: #ff9c9c; text-decoration: none; }
      ins { background: #a3f3a3; text-decoration: none; }
    </style>
  </head>
  <body>
    <main id="content" class="preview-page">
      <h1>User:SuperCode111/TypoSpotter/run</h1>
      <p>Local visual preview using synthetic article data</p>
      <div id="mw-content-text"><div class="mw-parser-output">Fallback message</div></div>
    </main>
    <script src="mock-wiki.js"></script>
    <script src="../dist/TypoSpotter.user.js"></script>
  </body>
</html>
